name: deepfake-platform

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Private: no published ports. Only the server talks to it.
  ml-service:
    build:
      context: ./ml-service
      args:
        # true installs the real-mode ML stack into the image (see README, "Real mode").
        WITH_ML: ${WITH_ML:-false}
    restart: unless-stopped
    environment:
      MOCK_MODE: ${MOCK_MODE:-true}
      DEVICE: ${DEVICE:-auto}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-dev-internal-secret-change-me}
      UPLOAD_DIR: /data/uploads
      WEIGHTS_DIR: /app/weights
      K: ${K:-4}
      MAX_FRAMES: ${MAX_FRAMES:-32}
      VIDEO_TOP_K: ${VIDEO_TOP_K:-5}
      MAX_VIDEO_MB: ${MAX_VIDEO_MB:-100}
      MAX_IMAGE_MB: ${MAX_IMAGE_MB:-10}
    volumes:
      - uploads:/data/uploads
      - ./ml-service/weights:/app/weights
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      # Real mode imports PyTorch before it can answer.
      start_period: 60s

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      ml-service: { condition: service_healthy }
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      MOCK_MODE: ${MOCK_MODE:-true}
      MONGO_URL: mongodb://mongo:27017/deepfake
      REDIS_URL: redis://redis:6379
      ML_SERVICE_URL: http://ml-service:8000
      INTERNAL_SECRET: ${INTERNAL_SECRET:-dev-internal-secret-change-me}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me}
      UPLOAD_DIR: /data/uploads
      MEDIA_TTL_HOURS: ${MEDIA_TTL_HOURS:-24}
      MAX_IMAGE_MB: ${MAX_IMAGE_MB:-10}
      MAX_VIDEO_MB: ${MAX_VIDEO_MB:-100}
      K: ${K:-4}
      VIDEO_K: ${VIDEO_K:-0}
      # Same origin by default (nginx proxies /api and /socket.io); comma-separated origins.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      RATE_LIMIT_AUTH_PER_15MIN: ${RATE_LIMIT_AUTH_PER_15MIN:-20}
      RATE_LIMIT_UPLOADS_PER_HOUR: ${RATE_LIMIT_UPLOADS_PER_HOUR:-30}
      RATE_LIMIT_ASK_PER_HOUR: ${RATE_LIMIT_ASK_PER_HOUR:-60}
      RATE_LIMIT_COMPARE_PER_HOUR: ${RATE_LIMIT_COMPARE_PER_HOUR:-20}
      JOB_ATTEMPTS: ${JOB_ATTEMPTS:-2}
      STALE_JOB_MINUTES: ${STALE_JOB_MINUTES:-30}
      # Second check (Hive v3): mock by default, so turning MOCK_MODE off for the real models
      # never starts paid calls by itself. Set HIVE_MODE=real (and a key) to opt in.
      HIVE_MODE: ${HIVE_MODE:-mock}
      HIVE_API_KEY: ${HIVE_API_KEY:-}
      HIVE_API_URL: ${HIVE_API_URL:-}
      HIVE_THRESHOLD: ${HIVE_THRESHOLD:-0.9}
      HIVE_TIMEOUT_MS: ${HIVE_TIMEOUT_MS:-15000}
      HIVE_DAILY_LIMIT: ${HIVE_DAILY_LIMIT:-100}
      HIVE_DEMO_RESERVE: ${HIVE_DEMO_RESERVE:-20}
      HIVE_USER_DAILY_LIMIT: ${HIVE_USER_DAILY_LIMIT:-10}
      HIVE_RETRIES: ${HIVE_RETRIES:-0}
      # Explanations and Ask (Groq): off by default; the template is used. GROQ_MODE=real opts in.
      GROQ_MODE: ${GROQ_MODE:-off}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-}
      GROQ_MODEL_EXPLAIN: ${GROQ_MODEL_EXPLAIN:-openai/gpt-oss-120b}
      GROQ_MODEL_CHAT: ${GROQ_MODEL_CHAT:-openai/gpt-oss-20b}
      GROQ_MODEL_FALLBACKS: ${GROQ_MODEL_FALLBACKS:-openai/gpt-oss-20b}
      GROQ_TIMEOUT_MS: ${GROQ_TIMEOUT_MS:-20000}
      GROQ_RETRIES: ${GROQ_RETRIES:-2}
      GROQ_DAILY_LIMIT: ${GROQ_DAILY_LIMIT:-900}
      GROQ_MAX_COMPLETION_TOKENS: ${GROQ_MAX_COMPLETION_TOKENS:-1024}
      GROQ_REASONING_EFFORT: ${GROQ_REASONING_EFFORT:-low}
      GROQ_TEMPERATURE: ${GROQ_TEMPERATURE:-0.2}
    volumes:
      - uploads:/data/uploads
    ports:
      - "${SERVER_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      server: { condition: service_healthy }
    ports:
      - "${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mongo-data:
  uploads:
