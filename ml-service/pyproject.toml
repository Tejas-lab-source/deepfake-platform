[project]
name = "ml-service"
version = "0.1.0"
requires-python = ">=3.11"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[[tool.mypy.overrides]]
module = [
  "cv2.*", "mediapipe.*", "skimage.*", "facenet_pytorch.*", "pytorch_grad_cam.*",
  "efficientnet_pytorch.*", "transformers.*", "safetensors.*", "gfpgan.*", "torch.*", "PIL.*",
]
ignore_missing_imports = true
follow_imports = "skip"

# The ML libraries above are untyped (or skipped), so values that come from them are Any.
[[tool.mypy.overrides]]
module = ["app.*", "offline.*"]
warn_return_any = false
disallow_subclassing_any = false
disallow_untyped_decorators = false
