name: CI

on:
  push:
    branches: [main, 'phase-*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No job needs Hive or Groq credentials: Hive runs in mock mode, Groq is off, and the
# provider tests use fake networks.
env:
  HIVE_MODE: mock
  GROQ_MODE: off

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s --health-retries 30
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx eslint src tests scripts
      - run: npx prettier --check src tests scripts
      - name: Tests (unit, routes, sockets, PDF, Redis and MongoDB integration)
        run: npm test
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379/15
          TEST_MONGO_URL: mongodb://127.0.0.1:27017
      - run: npm run build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            ml-service/requirements.txt
            ml-service/requirements-ml.txt
            ml-service/requirements-offline.txt
            ml-service/requirements-dev.txt
      - name: System libraries for MediaPipe and OpenCV
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgles2 libgl1
      - run: pip install -r requirements.txt -r requirements-ml.txt -r requirements-offline.txt -r requirements-dev.txt
      - run: ruff check .
      - run: black --check .
      - run: mypy app offline
      # Model weights are not in the repository (licences; the SBI checkpoint needs a manual
      # download), so the tests that need them report "skipped: needs ... weights" here. They
      # run wherever the weights are present (see README, "Testing").
      - run: pytest -q -rs

  compose-e2e:
    runs-on: ubuntu-latest
    needs: [server, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
      - run: docker compose up -d --build --wait --wait-timeout 300
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - name: Mock end-to-end smoke test
        run: npx tsx scripts/smoke.ts
        working-directory: server
        env:
          SMOKE_BASE: http://localhost:8080
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - if: always()
        run: docker compose down -v
